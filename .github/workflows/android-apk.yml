name: Build Android APK

# בונה את אפליקציית האנדרואיד בשרתים של GitHub (שם יש גישה מלאה לכלי הבנייה של Google).
# מריצים ידנית: Actions → "Build Android APK" → Run workflow. הקובץ מופיע בתחתית דף ההרצה תחת Artifacts.
on:
  workflow_dispatch:
  push:
    branches: ["ccr-*"]
    paths: ["android/**", "models/onnx/**", "shared/pipeline.json", ".github/workflows/android-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses (the SDK is preinstalled on the runner)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests (JVM)
        working-directory: android
        run: chmod +x gradlew && ./gradlew :core:test --no-daemon --stacktrace
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Show what is inside the APK
        run: |
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep -E "pipeline.json|\.onnx|\.so$|classes[0-9]*\.dex" || true
      - uses: actions/upload-artifact@v4
        with:
          name: BlueShield-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # End-to-end test on an Android emulator: decode → analyse → render → encode on a real Android runtime.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 36]   # 36 = the Android version of the Galaxy S25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on emulator (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 4096
          working-directory: android
          script: bash ../.github/scripts/emulator-test.sh
