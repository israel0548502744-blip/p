name: Build Android APK

# בונה את אפליקציית האנדרואיד בשרתים של GitHub (שם יש גישה מלאה לכלי הבנייה של Google).
# מריצים ידנית: Actions → "Build Android APK" → Run workflow. הקובץ מופיע בתחתית דף ההרצה תחת Artifacts.
on:
  workflow_dispatch:
  push:
    branches: ["ccr-*"]
    paths: ["android/**", "models/onnx/**", "shared/pipeline.json", ".github/workflows/android-apk.yml"]

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Core unit tests (JVM)
        working-directory: android
        run: chmod +x gradlew && ./gradlew :core:test --no-daemon --stacktrace
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: BlueShield-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
