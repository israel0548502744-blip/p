name: Fetch extra models
# Downloads models whose hosts the development sandbox can't reach, converts them to ONNX and stores them
# (with the originals) on the `extra-models` branch. Licences: see .github/models/README.md.
on:
  push:
    paths: [".github/models/**", ".github/workflows/fetch-models.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install converters
        run: pip install -q "paddlepaddle==2.6.2" "paddle2onnx==1.2.11" onnx onnxruntime numpy
      - name: PaddleClas PULC person_attribute (Apache-2.0, trained on PA-100K, CC BY 4.0)
        run: |
          mkdir -p out && cd out
          curl -sSfL -o person_attribute_infer.tar https://paddleclas.bj.bcebos.com/models/PULC/person_attribute_infer.tar
          tar -xf person_attribute_infer.tar && ls -la person_attribute_infer
          paddle2onnx --model_dir person_attribute_infer --model_filename inference.pdmodel --params_filename inference.pdiparams \
            --save_file pulc_person_attribute.onnx --opset_version 13 --enable_onnx_checker True
          python3 -c "
          import onnxruntime as ort, numpy as np
          s = ort.InferenceSession('pulc_person_attribute.onnx')
          i = s.get_inputs()[0]; print('input', i.name, i.shape)
          x = np.random.rand(1, 3, 256, 192).astype(np.float32)
          y = s.run(None, {i.name: x})[0]; print('output', y.shape, y.min(), y.max())
          "
          ls -la
      - name: Publish to the extra-models branch
        run: |
          cd out
          git init -q -b extra-models
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Extra models (see .github/models/README.md on the main branch for licences)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" extra-models
